# 飞牛 NAS (FnOS) 部署配置 —— 拉取 GHCR 预构建镜像（含后台 admin 代码）
#
# 镜像由 GitHub Actions 自动构建并推送到 GHCR，地址：
#   ghcr.io/fu5502/my-homepage:latest
#
# 用法（在飞牛NAS 终端，进入本仓库目录后）：
#   docker compose pull
#   docker compose up -d
#
# 说明：
# - ./config 目录挂载到容器 /config（entrypoint 自动软链为 /app/config），
#   后台在 /admin 里新增/修改的站点链接会实时写回这里的 bookmarks.yaml。
# - PUID/PGID 设成飞牛首个用户的 uid/gid（通常是 1000），
#   这样容器内写出的配置文件在 NAS 上归你这个用户，方便用 SMB/文件管理器编辑。
# - 若该路径在飞牛上不存在，请先到「文件」里建好共享文件夹再填真实绝对路径，
#   例如：/vol1/1000/docker/homepage/config

services:
  homepage:
    image: ghcr.io/fu5502/my-homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config:/config
    environment:
      # ===== 登录鉴权（密码方式）=====
      # 注意：本版本 homepage 的密码登录走环境变量，而非 settings.yaml 的 auth.users。
      # 必须同时具备下面 4 个变量，next-auth 才会注册出「密码」登录方式。
      - HOMEPAGE_AUTH_ENABLED=true
      # 登录密码（单一全局密码，登录页只填密码、无需用户名）
      - HOMEPAGE_AUTH_PASSWORD=fugang520123
      # 鉴权会话密钥（随机串，改了会让已登录会话失效）
      - HOMEPAGE_AUTH_SECRET=mcGCoKhUAYwUNtwGTguEx27yQkVV2DBahKovvNCfGwI
      # 外部访问地址，next-auth 必填（换成你的 NAS IP/域名）
      - HOMEPAGE_EXTERNAL_URL=http://192.168.99.147:3000
      # 飞牛首个用户通常 uid/gid=1000；如不确定可临时设 0 让容器以 root 运行
      - PUID=1000
      - PGID=1000
      # 容器监听地址（FnOS 网络环境下 0.0.0.0 更稳妥）
      - HOSTNAME=0.0.0.0
      # homepage 的 Host 校验白名单：允许通过该地址访问（改成你的 NAS IP/域名）
      - HOMEPAGE_ALLOWED_HOSTS=192.168.99.147:3000,localhost:3000
